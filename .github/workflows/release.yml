# Builds the Windows installer and publishes it as a GitHub Release when a version tag (v*) is pushed.
# The installed app checks these Releases and updates itself.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag this version (when started by hand)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then
            git tag "$v" && git push origin "$v"
          fi
      - name: Create the GitHub release first
        # electron-builder uploads the installer, blockmap and latest.yml in parallel; if the release doesn't exist
        # yet, each upload can create its own copy (that happened with v0.7.0 and broke "Check for updates").
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="$(node -p "require('./package.json').version")"
          gh release view "v$ver" >/dev/null 2>&1 || gh release create "v$ver" --title "$ver" --notes "Oopsmith Studio $ver" --verify-tag
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/build.mjs
      - name: Build installer and publish the release
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
